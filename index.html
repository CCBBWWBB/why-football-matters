<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Why Football Matters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
/* Layout: one-screen toy — slim control bar on top, the cover filling the rest. Single committed look: newsprint black with Big Issue yellow. */
:root {
  --bg: #0d0d0d;
  --panel: #161616;
  --fg: #f4f4f0;
  --muted: #9a9a92;
  --yellow: #fff200;
  --ink: #0d0d0d;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
.bar {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  border-bottom: 1px solid #262626;
}
.mark { display: flex; flex-direction: column; gap: 2px; margin-right: auto; min-width: 0; }
.mark b { font-variation-settings: "wdth" 70; font-weight: 900; font-size: 22px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.mark span { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.modes { display: inline-flex; background: var(--panel); border-radius: 999px; padding: 3px; }
.modes button, .act {
  font: 700 13px/1 var(--display); letter-spacing: .04em; text-transform: uppercase;
  border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; color: var(--fg); background: transparent;
}
.modes button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }
.act { background: var(--panel); }
.act:hover, .modes button:hover { outline: 1px solid #3a3a3a; }
button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9ch; }
.status.win { color: var(--yellow); }
.stage { position: relative; flex: 1; min-height: 0; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.tip { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; padding-inline: 16px; }
@media (max-width: 560px) { .mark b { font-size: 18px; } .act, .modes button { padding: 9px 11px; font-size: 12px; } }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="mark"><b>Why Football Matters</b><span>The Big Issue #1469 · 05 July 2021</span></div>
    <div class="modes" role="group" aria-label="Mode">
      <button id="m-play" type="button" aria-pressed="true">Play</button>
      <button id="m-puzzle" type="button" aria-pressed="false">Puzzle</button>
    </div>
    <button class="act" id="act" type="button">Kick-off</button>
    <span class="status" id="status" aria-live="polite"></span>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="The Big Issue cover split into 77 tiles. In Play mode, sweep across it to knock tiles about, drag one to fling it, tap to burst. In Puzzle mode, drag a tile onto another to swap them."></canvas>
    <div class="tip" id="tip">Sweep across the cover. Grab a tile and throw it. Tap to burst.</div>
  </div>
</div>

  let IW = 1825, IH = 2576, TW = IW / COLS, TH = IH / ROWS;
  let W = 0, H = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
  let mode = 'play', moves = 0, solved = true;
  const tiles = [];   // tile i always shows source cell i; slot = where it currently belongs

  function homeOf(slot) { return { x: (slot % COLS + 0.5) * TW, y: (Math.floor(slot / COLS) + 0.5) * TH }; }

  function initTiles() {
    tiles.length = 0;
    for (let i = 0; i < COLS * ROWS; i++) {
      const h = homeOf(i);
      tiles.push({ i, slot: i, x: h.x, y: h.y, vx: 0, vy: 0, a: 0, va: 0, lift: 0, hold: 0, delay: 0 });
    }
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height; dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const pad = Math.min(36, Math.max(14, W * 0.04));
    scale = Math.min((W - pad * 2) / IW, (H - pad * 2 - 18) / IH);
    ox = (W - IW * scale) / 2; oy = (H - 18 - IH * scale) / 2;
  }
  const toCover = (cx, cy) => ({ x: (cx - ox) / scale, y: (cy - oy) / scale });

  // ---------- pointer ----------
  let ptr = { x: 0, y: 0, vx: 0, vy: 0, inside: false, t: 0 };
  let grab = null;

  function local(e) { const r = canvas.getBoundingClientRect(); return toCover(e.clientX - r.left, e.clientY - r.top); }
  function tileAt(p) {
    // topmost tile whose rotated rect contains p
    const order = tiles.slice().sort((a, b) => b.lift - a.lift);
    for (const t of order) {
      const dx = p.x - t.x, dy = p.y - t.y, c = Math.cos(-t.a), s = Math.sin(-t.a);
      const lx = dx * c - dy * s, ly = dx * s + dy * c;
      if (Math.abs(lx) <= TW / 2 && Math.abs(ly) <= TH / 2) return t;
    }
    return null;
  }
  function slotAt(p) {
    const c = Math.floor(p.x / TW), r = Math.floor(p.y / TH);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return -1;
    return r * COLS + c;
  }

  canvas.addEventListener('pointerdown', e => {
    const p = local(e); const t = tileAt(p);
    ptr = { ...ptr, x: p.x, y: p.y, vx: 0, vy: 0, t: performance.now() };
    if (!t) { if (mode === 'play') burst(p.x, p.y, 0.8); return; }
    grab = { t, ox: t.x - p.x, oy: t.y - p.y, sx: e.clientX, sy: e.clientY, time: performance.now(), moved: 0, px: p.x, py: p.y };
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    const p = local(e), now = performance.now(), dt = Math.max(1, now - ptr.t) / 1000;
    const nvx = (p.x - ptr.x) / dt, nvy = (p.y - ptr.y) / dt;
    ptr.vx = ptr.vx * 0.5 + nvx * 0.5; ptr.vy = ptr.vy * 0.5 + nvy * 0.5;
    ptr.x = p.x; ptr.y = p.y; ptr.t = now; ptr.inside = true;
    if (grab) { grab.px = p.x; grab.py = p.y; grab.moved = Math.max(grab.moved, Math.hypot(e.clientX - grab.sx, e.clientY - grab.sy)); }
  });
  canvas.addEventListener('pointerleave', () => { ptr.inside = false; });
  function release(e) {
    if (!grab) return;
    const g = grab; grab = null; canvas.classList.remove('dragging');
    const tapped = g.moved < 6 && performance.now() - g.time < 300;
    if (mode === 'play') {
      if (tapped) burst(g.px, g.py, 1);
      else { g.t.vx = clamp(ptr.vx, 6000); g.t.vy = clamp(ptr.vy, 6000); g.t.va += (Math.random() - .5) * 8; g.t.hold = 0.35; }
    } else {
      const target = slotAt({ x: g.px, y: g.py });
      const other = target >= 0 ? tiles.find(t => t.slot === target) : null;
      if (other && other !== g.t) {
        const s = g.t.slot; g.t.slot = other.slot; other.slot = s;
        other.va += (Math.random() - .5) * 6; other.lift = 0.6;
        moves++; checkSolved();
      }
    }
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));

  // ---------- actions ----------
  function burst(x, y, power) {
    const P = (reduce ? 0.35 : 1) * power;
    for (const t of tiles) {
      const dx = t.x - x, dy = t.y - y, d = Math.hypot(dx, dy) || 1;
      const f = Math.max(0, 1 - d / (TW * 4.2));
      if (!f) continue;
      const k = 5200 * f * f * P;
      t.vx += dx / d * k; t.vy += dy / d * k;
      t.va += (Math.random() - .5) * 26 * f * P;
      t.lift = Math.max(t.lift, f);
      t.hold = 0.18 * f;
    }
  }

  function kickoff() {
    // the whole cover blows apart from its centre, then rebuilds in a wave
    for (const t of tiles) {
      const h = homeOf(t.slot), dx = h.x - IW / 2, dy = h.y - IH * 0.6, d = Math.hypot(dx, dy) || 1;
      const k = (reduce ? 900 : 3800) * (0.6 + Math.random() * 0.7);
      t.vx += dx / d * k + (Math.random() - .5) * 900; t.vy += dy / d * k - 600 + (Math.random() - .5) * 900;
      t.va += (Math.random() - .5) * (reduce ? 4 : 18); t.lift = 1;
      t.hold = 0.55 + (d / IH) * 0.5;
    }
  }

  function shuffle() {
    const slots = tiles.map(t => t.slot);
    do { for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; } }
    while (slots.some((s, i) => s === i) && Math.random() < 0.6);   // mostly out of place
    tiles.forEach((t, i) => { t.slot = slots[i]; t.va += (Math.random() - .5) * 10; t.lift = 1; t.delay = (t.i % COLS) * 0.03 + Math.floor(t.i / COLS) * 0.02; });
    moves = 0; solved = false; updateStatus();
  }

  function solve() {
    tiles.forEach(t => { t.slot = t.i; t.lift = 0.8; t.delay = (t.i % COLS + Math.floor(t.i / COLS)) * 0.025; t.va += (Math.random() - .5) * 4; });
    solved = true; updateStatus();
  }

  function checkSolved() {
    const placed = tiles.filter(t => t.slot === t.i).length;
    if (placed === tiles.length && !solved) {
      solved = true;
      // victory wave
      tiles.forEach(t => { t.delay = (t.i % COLS + Math.floor(t.i / COLS)) * 0.035; t.lift = 1; t.va += (t.i % 2 ? 1 : -1) * 3; });
      statusEl.textContent = `Rebuilt in ${moves} swaps`; statusEl.classList.add('win');
      return;
    }
    updateStatus();
  }
  function updateStatus() {
    statusEl.classList.remove('win');
    if (mode === 'play') { statusEl.textContent = ''; return; }
    const placed = tiles.filter(t => t.slot === t.i).length;
    statusEl.textContent = solved ? 'Solved' : `${placed}/77 · ${moves} swaps`;
  }

  function setMode(m) {
    mode = m;
    bPlay.setAttribute('aria-pressed', m === 'play'); bPuzzle.setAttribute('aria-pressed', m === 'puzzle');
    if (m === 'play') { if (!solved) solve(); actBtn.textContent = 'Kick-off'; tip.textContent = 'Sweep across the cover. Grab a tile and throw it. Tap to burst.'; }
    else { shuffle(); actBtn.textContent = 'Solve it'; tip.textContent = 'Drag a tile onto another to swap them. Rebuild the cover.'; }
    updateStatus();
  }
  bPlay.addEventListener('click', () => setMode('play'));
  bPuzzle.addEventListener('click', () => setMode('puzzle'));
  actBtn.addEventListener('click', () => {
    if (mode === 'play') kickoff();
    else if (solved) { shuffle(); actBtn.textContent = 'Solve it'; }
    else { solve(); actBtn.textContent = 'Shuffle'; }
  });

  // ---------- simulation ----------
  function update(dt) {
    const decay = Math.exp(-dt * 10); ptr.vx *= decay; ptr.vy *= decay;
    const wake = mode === 'play' && ptr.inside && !grab;
    const pv = Math.hypot(ptr.vx, ptr.vy);
    for (const t of tiles) {
      if (t.delay > 0) { t.delay -= dt; continue; }
      const h = homeOf(t.slot);
      if (grab && grab.t === t) {
        // held tile chases the pointer with a little lag and swings from the grab point
        const tx = grab.px + grab.ox, ty = grab.py + grab.oy;
        t.vx = (tx - t.x) * 22; t.vy = (ty - t.y) * 22;
        t.x += t.vx * dt; t.y += t.vy * dt;
        const swing = clamp(t.vx / 9000, 0.5);
        t.a += (swing - t.a) * Math.min(1, dt * 10);
        t.lift += (1.4 - t.lift) * Math.min(1, dt * 12);
        continue;
      }
      // pointer wake: tiles near a moving pointer get shoved along its path
      if (wake && pv > 60) {
        const dx = t.x - ptr.x, dy = t.y - ptr.y, d = Math.hypot(dx, dy), R = TW * 1.25;
        if (d < R) {
          const f = (1 - d / R) ** 2, blend = Math.min(1, dt * 18) * f, sp = Math.min(pv, 6000), push = sp * 0.35 * blend;
          t.vx += (ptr.vx / pv * sp * 0.9 - t.vx) * blend + dx / (d || 1) * push;
          t.vy += (ptr.vy / pv * sp * 0.9 - t.vy) * blend + dy / (d || 1) * push;
          t.va += ((dx * ptr.vy - dy * ptr.vx) / (d * pv || 1)) * f * Math.min(pv, 5000) * 0.0028;
          t.lift = Math.max(t.lift, f * 0.9);
        }
      }
      if (t.hold > 0) t.hold -= dt;
      const k = t.hold > 0 ? 6 : 150, c = t.hold > 0 ? 1.2 : 17;
      t.vx += ((h.x - t.x) * k - t.vx * c) * dt;
      t.vy += ((h.y - t.y) * k - t.vy * c) * dt;
      t.va += (-t.a * k * 0.9 - t.va * c * 0.85) * dt;
      t.x += t.vx * dt; t.y += t.vy * dt; t.a += t.va * dt;
      const off = Math.hypot(h.x - t.x, h.y - t.y) / TW;
      t.lift += (Math.min(1, off * 0.8 + Math.abs(t.a) * 0.8) - t.lift) * Math.min(1, dt * 5);
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // empty-slot bed: shows where tiles belong when they leave
    ctx.fillStyle = '#1b1b1b'; ctx.fillRect(ox, oy, IW * scale, IH * scale);
    ctx.strokeStyle = '#262626'; ctx.lineWidth = 1;
    for (let c = 1; c < COLS; c++) { const x = ox + c * TW * scale; ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + IH * scale); ctx.stroke(); }
    for (let r = 1; r < ROWS; r++) { const y = oy + r * TH * scale; ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + IW * scale, y); ctx.stroke(); }
    if (!img.complete || !img.naturalWidth) return;
    const order = tiles.slice().sort((a, b) => a.lift - b.lift);
    const w = TW * scale, h = TH * scale;
    for (const t of order) {
      const sx = (t.i % COLS) * TW, sy = Math.floor(t.i / COLS) * TH;
      const cx = ox + t.x * scale, cy = oy + t.y * scale, s = 1 + t.lift * 0.07;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(t.a); ctx.scale(s, s);
      if (t.lift > 0.03) {
        ctx.shadowColor = `rgba(0,0,0,${0.25 + t.lift * 0.35})`;
        ctx.shadowBlur = 6 + t.lift * 26; ctx.shadowOffsetY = 3 + t.lift * 14; ctx.shadowOffsetX = t.lift * 4;
        ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.shadowColor = 'transparent';
      }
      ctx.drawImage(img, sx, sy, TW, TH, -w / 2, -h / 2, w + 0.6, h + 0.6);
      if (mode === 'puzzle' && t.slot === t.i && !solved) { ctx.fillStyle = 'rgba(255,242,0,.9)'; ctx.fillRect(-w / 2, h / 2 - 3, w, 3); }
      ctx.restore();
    }
    // drop target hint
    if (mode === 'puzzle' && grab) {
      const sl = slotAt({ x: grab.px, y: grab.py });
      if (sl >= 0 && sl !== grab.t.slot) {
        const hm = homeOf(sl);
        ctx.strokeStyle = '#fff200'; ctx.lineWidth = 3;
        ctx.strokeRect(ox + (hm.x - TW / 2) * scale + 1.5, oy + (hm.y - TH / 2) * scale + 1.5, w - 3, h - 3);
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    const n = 3; for (let i = 0; i < n; i++) update(dt / n);
    draw();
    requestAnimationFrame(frame);
  }

  img.onload = () => {
    IW = img.naturalWidth; IH = img.naturalHeight; TW = IW / COLS; TH = IH / ROWS;
    initTiles(); resize();
    if (!reduce) setTimeout(() => burst(IW * 0.5, IH * 0.5, 0.55), 350);
  };
  img.onerror = () => { tip.textContent = 'The cover image did not load.'; };
  initTiles(); resize();
  addEventListener('resize', resize);
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
